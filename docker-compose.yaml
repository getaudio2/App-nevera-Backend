services:
  db:
    image: postgres:16
    container_name: backend_nevera
    restart: unless-stopped
    environment:
      POSTGRES_USER: nevera
      POSTGRES_PASSWORD: nevera123
      POSTGRES_DB: nevera_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: paul@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin-data: